<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Suite Life of Zack &amp; Cody</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b22;--mute:#6b6874;--line:#e2dfd7;--acc:#d6336c;--ok:#1f9d63;--okbg:#e4f5ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121018;--card:#1c1926;--ink:#f1eef7;--mute:#9a96a6;--line:#2c2839;--acc:#ff5c9a;--ok:#46d391;--okbg:#14291f}}
:root[data-theme="dark"]{--bg:#121018;--card:#1c1926;--ink:#f1eef7;--mute:#9a96a6;--line:#2c2839;--acc:#ff5c9a;--ok:#46d391;--okbg:#14291f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.hero{border-radius:18px;padding:26px 22px;background:linear-gradient(135deg,#2b1055,#d6336c 70%,#ff9a5c);color:#fff}
.hero h1{margin:0 0 4px;font-size:clamp(22px,5vw,34px);letter-spacing:-.5px}
.hero p{margin:0 0 16px;opacity:.9}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .3s}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:10px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--acc)}
.primary{background:#fff;color:#2b1055;border:0;font-weight:700;padding:9px 16px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:18px 0 10px;padding-bottom:4px}
.tab{white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab small{opacity:.8;margin-left:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools .sp{flex:1}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ep.done{background:var(--okbg);border-color:var(--ok)}
.ep .top{display:flex;justify-content:space-between;align-items:center}
.num{font-size:26px;font-weight:800;letter-spacing:-1px}
.st{font-size:12px;color:var(--mute)}
.done .st{color:var(--ok);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts button,.acts .btn{font-size:13px;padding:5px 9px}
.watch{background:var(--acc);border-color:var(--acc);color:#fff}
.ed{display:flex;gap:6px}
.ed input{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.empty{color:var(--mute);padding:30px;text-align:center}
footer{margin:22px 0 8px;color:var(--mute);font-size:13px;text-align:center}
.dock{display:none}
#pl{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#pl[hidden]{display:none}
.plbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.plbar button,.plact button,.plact .btn{background:#222;color:#fff;border-color:#444;min-height:46px}
.plv{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.plv iframe{width:100%;aspect-ratio:16/9;max-height:100%;border:0;background:#000}
.plact{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.plact button,.plact .btn{flex:1;text-align:center}
.plhint{padding:0 12px 12px;font-size:12px;opacity:.7;text-align:center}
.plbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pl.full .plbar{position:absolute;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);z-index:2;padding:6px;pointer-events:none}
#pl.full #plt,#pl.full #plx,#pl.full .plact,#pl.full .plhint{display:none}
#pl.full #plfs{pointer-events:auto;opacity:.65;min-height:38px}
#pl.full .plv{position:absolute;inset:0;overflow:hidden}
#pl.full .plv iframe{width:100%;height:100%;aspect-ratio:auto;max-height:none}
@media (orientation:portrait){
#pl.full .plbar{left:auto;right:env(safe-area-inset-right,0px)}
#pl.full .plv iframe{position:absolute;top:50%;left:50%;width:100vh;height:100vw;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg)}
}
.tools label{display:flex;gap:6px;align-items:center}
@media (max-width:600px){
.wrap{padding:10px 10px 90px}
.hero{padding:18px 16px;border-radius:14px}
.primary{display:block;width:100%;text-align:center}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:10px -10px;padding:8px 10px}
.tab{padding:10px 14px}
.tools button,.tools .chip{padding:9px 12px}
.grid{grid-template-columns:1fr;gap:8px}
.ep{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:6px 10px;padding:10px}
.ep .top{flex-direction:column;align-items:flex-start}
.acts{gap:6px}
.acts button,.acts .btn{min-height:44px;font-size:14px;padding:8px 12px;flex:1}
.acts .watch,.acts>.st{flex:1 1 100%;order:-1;text-align:center}
.acts .watch{font-weight:700;font-size:16px}
.ed{grid-column:1/-1}
.dock{display:block;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--acc);border-color:var(--acc);color:#fff;text-align:center;font-weight:700;padding:14px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🎬 The Suite Life of Zack &amp; Cody</h1>
    <p>Theo dõi tập phim · Mùa 1–3 &amp; On Deck</p>
    <div class="bar"><i id="gbar"></i></div>
    <div class="row">
      <span id="gtxt"></span>
      <a class="btn primary" id="cont" target="_blank" rel="noopener"></a>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <button class="chip" data-f="all">Tất cả</button>
    <button class="chip" data-f="todo">Chưa xem</button>
    <button class="chip" data-f="done">Đã xem</button>
    <span class="sp"></span>
    <span class="st" id="stxt"></span>
    <label class="st"><input type="checkbox" id="auto"> Tự đánh dấu đã xem khi bấm ▶</label>
    <button id="allbtn"></button>
    <button id="reset">Xoá tiến độ</button>
  </div>
  <div class="grid" id="grid"></div>
  <footer>Tiến độ được lưu ngay trên trình duyệt này. Link Google Drive đã được gắn sẵn cho từng tập; bấm 🔗 nếu muốn thay link khác.</footer>
</div>
<a class="btn dock" id="dock" target="_blank" rel="noopener"></a>
<div id="pl" hidden><div class="plbar"><button id="plx" aria-label="Đóng">✕</button><b id="plt"></b><button id="plfs" aria-label="Toàn màn hình">⛶</button></div><div class="plv"><iframe id="plf" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer" title="Trình xem"></iframe></div><div class="plact"><button id="plp">◀ Trước</button><button id="plw"></button><button id="pln">Sau ▶</button><a id="plo" class="btn" target="_blank" rel="noopener">Mở Drive ↗</a></div><div class="plhint">Không phát được? Bấm “Mở Drive ↗” để xem trên Google Drive.</div></div>

function stepPlayer(d){const f=flat();let i=f.findIndex(x=>x[0]===pc[0]&&x[1]===pc[1]);

function setFull(on){

  const s=S.find(z=>z.id===cur),all=cnt(s)===s.eps.length;
  $('stxt').textContent=cnt(s)+'/'+s.eps.length+' tập';
  $('allbtn').textContent=all?'Bỏ đánh dấu cả mùa':'Đánh dấu cả mùa';
  $('allbtn').onclick=()=>{s.eps.forEach(e=>{if(all)delete st.w[k(s.id,e)];else st.w[k(s.id,e)]=1});save();render()};
  $('reset').textContent=armed?'Bấm lại để xác nhận':'Xoá tiến độ';
  $('reset').onclick=()=>{if(!armed){armed=true;render();setTimeout(()=>{armed=false;render()},3000);return}st.w={};st.last=null;armed=false;save();render()};
  const list=s.eps.filter(e=>flt==='all'||(flt==='done'?done(s.id,e):!done(s.id,e)));
  $('grid').innerHTML=list.length?list.map(e=>{
    const x=k(s.id,e),d=done(s.id,e),l=st.l[x]||gl(s.id,e);
    return '<div class="ep'+(d?' done':'')+'" id="ep-'+x+'"><div class="top"><span class="num">'+String(e).padStart(2,'0')+'</span><span class="st">'+(d?'✓ Đã xem':'Chưa xem')+'</span></div>'+
    '<div class="acts"><button data-a="t" data-e="'+e+'">'+(d?'Bỏ xem':'Đã xem')+'</button>'+
    (l?'<a class="btn watch" data-w="'+e+'" href="'+esc(l)+'" target="_blank" rel="noopener">▶ Xem</a>':'<span class="st">Chưa có link</span>')+
    '<button data-a="l" data-e="'+e+'" aria-label="Sửa link">🔗</button>'+
    '<button data-a="u" data-e="'+e+'" title="Đánh dấu đã xem từ đầu đến tập này">⏮</button></div>'+
    (editing===x?'<div class="ed"><input id="inp" placeholder="Link tuỳ chỉnh (để trống = dùng link gốc)" value="'+esc(st.l[x]||'')+'"><button data-a="s" data-e="'+e+'">Lưu</button></div>':'')+'</div>'}).join('')
    :'<div class="empty">Không có tập nào trong mục này.</div>';
  document.querySelectorAll('#grid a.watch').forEach(a=>a.onclick=ev=>{const e=+a.dataset.w;if(embedUrl(linkOf(s.id,e))){ev.preventDefault();openPlayer(s.id,e)}else if(st.auto!==false&&!done(s.id,e)){st.w[k(s.id,e)]=1;st.last=k(s.id,e);save();setTimeout(render,50)}});
  document.querySelectorAll('#grid button').forEach(b=>b.onclick=()=>{
    const e=+b.dataset.e,x=k(s.id,e),a=b.dataset.a;
    if(a==='t')toggle(s.id,e);
    else if(a==='u')upTo(s.id,e);
    else if(a==='l'){editing=editing===x?null:x;render();const i=$('inp');if(i)i.focus()}
    else if(a==='s'){const v=$('inp').value.trim();if(v)st.l[x]=v;else delete st.l[x];editing=null;save();render()}
  });
}
render();
</script>
</body>
</html>
